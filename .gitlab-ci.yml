stages:
  - verify
  - test
  - build
  - deploy

web_verify:
  stage: verify
  image: node:20
  cache:
    key:
      files:
        - apps/web/package-lock.json
    paths:
      - apps/web/node_modules/
  script:
    - npm --prefix apps/web ci
    - npm --prefix apps/web run typecheck
    - npm --prefix apps/web run build
    - npm --prefix apps/web run build:cloudflare

python_verify:
  stage: verify
  image: python:3.12
  script:
    - python -m pip install --upgrade pip
    - pip install -r requirements.txt
    - pip install -r requirements-hermes.txt
    - python apps/api/check_api.py
    - python -m py_compile apps/worker/jobs/deploy_daily_report.py apps/worker/jobs/run_daily_report.py

python_test:
  stage: test
  image: python:3.12
  script:
    - python -m pip install --upgrade pip
    - pip install -r requirements.txt
    - pip install -r requirements-hermes.txt
    - python -m unittest discover -s tests -p "test_*_unittest.py" -v

supabase_rls_test:
  stage: test
  image: postgres:17-alpine
  script:
    - test -n "$SUPABASE_TEST_DATABASE_URL"
    - psql "$SUPABASE_TEST_DATABASE_URL" -f supabase/tests/rls_ci.sql
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $SUPABASE_TEST_DATABASE_URL'

.azure_login:
  image: mcr.microsoft.com/azure-cli:latest
  before_script:
    - test -n "$AZURE_CLIENT_ID"
    - test -n "$AZURE_CLIENT_SECRET"
    - test -n "$AZURE_TENANT_ID"
    - test -n "$AZURE_SUBSCRIPTION_ID"
    - test -n "$AZURE_RESOURCE_GROUP"
    - test -n "$AZURE_API_APP_NAME"
    - test -n "$AZURE_WORKER_JOB_NAME"
    - az login --service-principal --username "$AZURE_CLIENT_ID" --password "$AZURE_CLIENT_SECRET" --tenant "$AZURE_TENANT_ID"
    - az account set --subscription "$AZURE_SUBSCRIPTION_ID"

.acr_image_build:
  image: docker:27-cli
  services:
    - name: docker:27-dind
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: "/certs/client"
  before_script:
    - echo "$AZURE_ACR_PASSWORD" | docker login "$AZURE_ACR_LOGIN_SERVER" --username "$AZURE_ACR_USERNAME" --password-stdin

build_api:
  extends: .acr_image_build
  stage: build
  script:
    - docker build --pull --file docker/Dockerfile.api --tag "$AZURE_ACR_LOGIN_SERVER/investment-api:$CI_COMMIT_SHA" --tag "$AZURE_ACR_LOGIN_SERVER/investment-api:latest" .
    - docker push "$AZURE_ACR_LOGIN_SERVER/investment-api:$CI_COMMIT_SHA"
    - docker push "$AZURE_ACR_LOGIN_SERVER/investment-api:latest"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $AZURE_ACR_LOGIN_SERVER && $AZURE_ACR_USERNAME && $AZURE_ACR_PASSWORD'

build_worker:
  extends: .acr_image_build
  stage: build
  script:
    - docker build --pull --file docker/Dockerfile.worker --tag "$AZURE_ACR_LOGIN_SERVER/investment-worker:$CI_COMMIT_SHA" --tag "$AZURE_ACR_LOGIN_SERVER/investment-worker:latest" .
    - docker push "$AZURE_ACR_LOGIN_SERVER/investment-worker:$CI_COMMIT_SHA"
    - docker push "$AZURE_ACR_LOGIN_SERVER/investment-worker:latest"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $AZURE_ACR_LOGIN_SERVER && $AZURE_ACR_USERNAME && $AZURE_ACR_PASSWORD'

build_hermes:
  extends: .acr_image_build
  stage: build
  script:
    - docker build --pull --file docker/Dockerfile.hermes --tag "$AZURE_ACR_LOGIN_SERVER/investment-hermes:$CI_COMMIT_SHA" --tag "$AZURE_ACR_LOGIN_SERVER/investment-hermes:latest" .
    - docker push "$AZURE_ACR_LOGIN_SERVER/investment-hermes:$CI_COMMIT_SHA"
    - docker push "$AZURE_ACR_LOGIN_SERVER/investment-hermes:latest"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $AZURE_ACR_LOGIN_SERVER && $AZURE_ACR_USERNAME && $AZURE_ACR_PASSWORD'

deploy_azure:
  extends: .azure_login
  stage: deploy
  needs:
    - build_api
    - build_worker
    - build_hermes
    - python_test
    - web_verify
    - job: supabase_rls_test
      optional: true
  script:
    - az containerapp update --resource-group "$AZURE_RESOURCE_GROUP" --name "$AZURE_API_APP_NAME" --image "$AZURE_ACR_LOGIN_SERVER/investment-api:$CI_COMMIT_SHA"
    - az containerapp job update --resource-group "$AZURE_RESOURCE_GROUP" --name "$AZURE_WORKER_JOB_NAME" --image "$AZURE_ACR_LOGIN_SERVER/investment-worker:$CI_COMMIT_SHA"
    - if [ -n "$AZURE_HERMES_APP_NAME" ]; then az containerapp update --resource-group "$AZURE_RESOURCE_GROUP" --name "$AZURE_HERMES_APP_NAME" --image "$AZURE_ACR_LOGIN_SERVER/investment-hermes:$CI_COMMIT_SHA"; fi
  environment:
    name: production
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual

deploy_cloudflare:
  stage: deploy
  image: node:22
  needs:
    - web_verify
  before_script:
    - npm --prefix apps/web ci
  script:
    - npm --prefix apps/web run build:cloudflare
    - cd apps/web
    - npx wrangler deploy --var "NEXT_PUBLIC_SUPABASE_URL:$NEXT_PUBLIC_SUPABASE_URL" --var "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY" --var "API_BASE_URL:$API_BASE_URL" --var "OWNER_SUPABASE_USER_ID:$OWNER_SUPABASE_USER_ID"
    - printf '%s' "$EODHD_API_KEY" | npx wrangler secret put EODHD_API_KEY
  environment:
    name: web-production
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CLOUDFLARE_API_TOKEN && $CLOUDFLARE_ACCOUNT_ID && $NEXT_PUBLIC_SUPABASE_URL && $NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY && $API_BASE_URL && $OWNER_SUPABASE_USER_ID && $EODHD_API_KEY'
      when: manual
