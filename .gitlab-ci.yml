stages:
  - verify
  - test
  - deploy

web_verify:
  stage: verify
  image: node:20
  cache:
    key:
      files:
        - apps/web/package-lock.json
    paths:
      - apps/web/node_modules/
  script:
    - npm --prefix apps/web ci
    - npm --prefix apps/web run typecheck
    - npm --prefix apps/web run build
    - npm --prefix apps/web run build:cloudflare

python_verify:
  stage: verify
  image: python:3.12
  script:
    - python -m pip install --upgrade pip
    - pip install -r requirements.txt
    - pip install -r requirements-hermes.txt
    - python apps/api/check_api.py
    - python -m py_compile apps/worker/jobs/deploy_daily_report.py apps/worker/jobs/run_daily_report.py

python_test:
  stage: test
  image: python:3.12
  script:
    - python -m pip install --upgrade pip
    - pip install -r requirements.txt
    - pip install -r requirements-hermes.txt
    - python -m unittest discover -s tests -p "test_*_unittest.py" -v

supabase_rls_test:
  stage: test
  image: postgres:17-alpine
  script:
    - test -n "$SUPABASE_TEST_DATABASE_URL"
    - psql "$SUPABASE_TEST_DATABASE_URL" -f supabase/tests/rls_ci.sql
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $SUPABASE_TEST_DATABASE_URL'

deploy_cloudflare:
  stage: deploy
  image: node:22
  needs:
    - web_verify
  before_script:
    - npm --prefix apps/web ci
  script:
    - npm --prefix apps/web run build:cloudflare
    - cd apps/web
    - npx wrangler deploy --var "NEXT_PUBLIC_SUPABASE_URL:$NEXT_PUBLIC_SUPABASE_URL" --var "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY" --var "API_BASE_URL:$API_BASE_URL" --var "OWNER_SUPABASE_USER_ID:$OWNER_SUPABASE_USER_ID"
    - printf '%s' "$EODHD_API_KEY" | npx wrangler secret put EODHD_API_KEY
  environment:
    name: web-production
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CLOUDFLARE_API_TOKEN && $CLOUDFLARE_ACCOUNT_ID && $NEXT_PUBLIC_SUPABASE_URL && $NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY && $API_BASE_URL && $OWNER_SUPABASE_USER_ID && $EODHD_API_KEY'
      when: manual
